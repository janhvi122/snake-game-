
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080d12;
    font-family: Arial, sans-serif;
    color: white;
    padding: 15px;
}

.game-container {
    width: 100%;
    max-width: 480px;
    padding: 25px;
    text-align: center;
    background: #111b22;
    border: 1px solid #1e3931;
    border-radius: 20px;
    box-shadow: 0 0 30px #39ff8820;
}

h1 {
    color: #39ff88;
    font-size: 36px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #39ff88;
}

.subtitle {
    color: #9caeaa;
    margin: 10px 0 20px;
}

.score-board {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.score-box {
    flex: 1;
    padding: 12px;
    background: #19282c;
    border-radius: 12px;
}

.score-box span {
    color: #9caeaa;
    font-size: 12px;
}

.score-box h2 {
    color: #39ff88;
    margin-top: 5px;
}

.settings {
    margin-bottom: 15px;
}

select {
    background: #19282c;
    color: #39ff88;
    border: 1px solid #39ff88;
    padding: 8px 12px;
    border-radius: 8px;
    margin-left: 8px;
}

.canvas-wrapper {
    position: relative;
    width: 100%;
    border: 2px solid #39ff88;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px #39ff8833;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #09130f;
}

.overlay {
    position: absolute;
    inset: 0;
    background: #000c;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.overlay h2 {
    color: #39ff88;
    font-size: 30px;
}

.overlay p {
    color: white;
}

.hidden {
    display: none !important;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

button {
    cursor: pointer;
    background: #39ff88;
    color: #07120c;
    border: none;
    padding: 12px 17px;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: white;
    box-shadow: 0 0 15px #39ff88;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.95);
}

.mobile-controls {
    margin-top: 20px;
}

.mobile-controls div {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
}

.mobile-controls button {
    width: 55px;
    height: 45px;
    font-size: 18px;
    padding: 5px;
    touch-action: manipulation;
}

.instructions {
    color: #9caeaa;
    margin-top: 20px;
    font-size: 13px;
}

.footer {
    color: #53645d;
    margin-top: 15px;
    font-size: 12px;
}

@media(max-width: 480px) {
    .game-container {
        padding: 15px;
    }

    h1 {
        font-size: 29px;
    }

    button {
        padding: 11px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<main class="game-container">

    <h1>SNAKE GAME</h1>
    <p class="subtitle">Eat • Grow • Survive</p>

    <div class="score-board">
        <div class="score-box">
            <span>SCORE</span>
            <h2 id="score">0</h2>
        </div>

        <div class="score-box">
            <span>HIGH SCORE</span>
            <h2 id="highScore">0</h2>
        </div>
    </div>

    <div class="settings">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="180">Easy</option>
            <option value="120" selected>Medium</option>
            <option value="75">Hard</option>
        </select>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">READY?</h2>
            <p id="overlayText">Press Start to play!</p>
        </div>
    </div>

    <div class="buttons">
        <button id="startBtn">START GAME</button>
        <button id="pauseBtn">PAUSE</button>
        <button id="restartBtn">RESTART</button>
    </div>

    <div class="mobile-controls">
        <button data-dir="up">▲</button>
        <div>
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
        </div>
    </div>

    <p class="instructions">
        Controls: Arrow Keys or WASD | Space: Pause
    </p>

    <p class="footer">Made with ♥ using HTML, CSS & JavaScript</p>

</main>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const difficulty = document.getElementById("difficulty");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;

let highScore = Number(
    localStorage.getItem("snakeHighScore")
) || 0;

let gameRunning = false;
let gameOver = false;
let paused = false;

let timer = null;
let speed = Number(difficulty.value);
let audioContext = null;

highScoreElement.textContent = highScore;

// Initialize game
function initGame() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};

    score = 0;
    speed = Number(difficulty.value);

    scoreElement.textContent = score;

    createFood();
    drawGame();
}

// Generate food
function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
    } while (snake.some(part =>
        part.x === food.x && part.y === food.y
    ));
}

// Draw game
function drawGame() {
    ctx.fillStyle = "#09130f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "rgba(57,255,136,0.06)";

    for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
    }

    // Food
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff3864";
    ctx.fillStyle = "#ff3864";

    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + 10,
        food.y * gridSize + 10,
        7,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Snake
    snake.forEach((part, index) => {
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#39ff88";

        ctx.fillStyle = index === 0
            ? "#a3ffca"
            : "#39ff88";

        ctx.fillRect(
            part.x * gridSize + 1,
            part.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
        );
    });

    ctx.shadowBlur = 0;
}

// Game movement
function moveSnake() {
    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    const ateFood =
        head.x === food.x && head.y === food.y;

    const bodyToCheck = ateFood
        ? snake
        : snake.slice(0, -1);

    // Wall collision
    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {
        endGame();
        return;
    }

    // Snake collision
    if (bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ateFood) {
        score += 10;
        scoreElement.textContent = score;

        playSound(600, 0.1);

        if (score > highScore) {
            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );

            highScoreElement.textContent = highScore;
        }

        createFood();

        speed = Math.max(45, speed - 3);
        restartTimer();

    } else {
        snake.pop();
    }

    drawGame();
}

// Game loop
function gameLoop() {
    if (!gameRunning || paused) return;

    moveSnake();

    if (gameRunning) {
        drawGame();
    }
}

function restartTimer() {
    clearInterval(timer);
    timer = setInterval(gameLoop, speed);
}

// Start game
function startGame() {
    if (gameRunning && !paused) return;

    if (gameOver) {
        initGame();
        gameOver = false;
    }

    gameRunning = true;
    paused = false;

    overlay.classList.add("hidden");

    startBtn.textContent = "START GAME";
    pauseBtn.textContent = "PAUSE";

    restartTimer();
}

// Pause / Resume
function pauseGame() {
    if (!gameRunning) return;

    paused = !paused;

    if (paused) {
        clearInterval(timer);

        overlayTitle.textContent = "PAUSED";
        overlayText.textContent = "Press Resume to continue";

        overlay.classList.remove("hidden");
        pauseBtn.textContent = "RESUME";

    } else {
        overlay.classList.add("hidden");
        pauseBtn.textContent = "PAUSE";

        restartTimer();
    }
}

// Game over
function endGame() {
    clearInterval(timer);

    gameRunning = false;
    paused = false;
    gameOver = true;

    playSound(180, 0.35);

    overlayTitle.textContent = "GAME OVER!";
    overlayText.textContent = `Your Score: ${score}`;

    overlay.classList.remove("hidden");
    startBtn.textContent = "PLAY AGAIN";
}

// Restart
function restartGame() {
    clearInterval(timer);

    gameRunning = false;
    paused = false;
    gameOver = false;

    initGame();

    overlayTitle.textContent = "READY?";
    overlayText.textContent = "Press Start to play!";

    overlay.classList.remove("hidden");

    startBtn.textContent = "START GAME";
    pauseBtn.textContent = "PAUSE";
}

// Change direction
function changeDirection(newDirection) {
    if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
    ) return;

    if (
        newDirection.x === -nextDirection.x &&
        newDirection.y === -nextDirection.y
    ) return;

    nextDirection = newDirection;
}

// Keyboard controls
document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    const directions = {
        arrowup: {x: 0, y: -1},
        w: {x: 0, y: -1},

        arrowdown: {x: 0, y: 1},
        s: {x: 0, y: 1},

        arrowleft: {x: -1, y: 0},
        a: {x: -1, y: 0},

        arrowright: {x: 1, y: 0},
        d: {x: 1, y: 0}
    };

    if (directions[key]) {
        event.preventDefault();
        changeDirection(directions[key]);
    }

    if (key === " " && gameRunning) {
        event.preventDefault();
        pauseGame();
    }
});

// Mobile controls
document.querySelectorAll(
    ".mobile-controls button"
).forEach(button => {

    button.addEventListener("click", () => {

        const directions = {
            up: {x: 0, y: -1},
            down: {x: 0, y: 1},
            left: {x: -1, y: 0},
            right: {x: 1, y: 0}
        };

        changeDirection(
            directions[button.dataset.dir]
        );
    });
});

// Sound effects
function playSound(frequency, duration) {
    try {
        audioContext ||= new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = frequency;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(
            0.15,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.start();
        oscillator.stop(
            audioContext.currentTime + duration
        );

    } catch (error) {
        console.warn("Audio unavailable", error);
    }
}

// Difficulty
difficulty.addEventListener("change", () => {
    speed = Number(difficulty.value);

    if (gameRunning && !paused) {
        restartTimer();
    }
});

// Buttons
startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", pauseGame);
restartBtn.addEventListener("click", restartGame);

// Auto-pause when browser tab is inactive
document.addEventListener("visibilitychange", () => {
    if (document.hidden && gameRunning && !paused) {
        pauseGame();
    }
});

// Initialize
initGame();

</script>

</body>
</html>
